  <style>
    :root{
      --bg:#f6f7f9;
      --muted:#68707f;
      --line:#e5eaf1;
      --radius:24px;
      /* La altura del header la fija main.css: 88px en escritorio y 72px en
         móvil. Aquí estaba clavada a 72px y la barra salía más baja que en el
         resto del sitio. */
    }

    *{ box-sizing:border-box; }
    html,
    body{ margin:0; padding:0; }
    body{
      min-height:100vh;
      font-family:var(--ui);
      color:var(--ink);
      background:var(--bg);
      padding-top:calc(var(--header-h, 88px) + var(--sat, 0px));
      position:relative;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image:
        radial-gradient(circle at top left, rgba(255,255,255,.95), transparent 30%),
        radial-gradient(circle at top right, rgba(230,236,244,.9), transparent 34%),
        linear-gradient(180deg, #fbfcfd 0%, #f3f5f8 100%);
      background-repeat:no-repeat;
      background-size:cover;
      z-index:-1;
      pointer-events:none;
    }
    a{ color:inherit; text-decoration:none; }
    img{ max-width:100%; display:block; }

    .wrap{
      min-height:calc(100vh - (var(--header-h, 88px) + var(--sat, 0px)));
      display:flex;
      justify-content:center;
      padding:28px 0 48px;
      position:relative;
    }
    .wrap::before{
      content:"";
      position:fixed;
      left:0;
      right:0;
      top:calc(var(--header-h) + var(--sat, 0px));
      height:90px;
      background:linear-gradient(180deg, #f6f7f9 0%, rgba(246,247,249,.96) 58%, rgba(246,247,249,0) 100%);
      pointer-events:none;
      z-index:24;
    }

    /* Una sola columna: el sidebar de resumen ya no existe (su info vive
       ahora dentro de .pedido-view), así el contenido usa todo el ancho. */
    .order-page-container{
      width:min(1160px, calc(100% - 40px));
      padding-inline:0 !important;
      margin-inline:auto;
      display:grid;
      grid-template-columns:minmax(0, 1fr);
      gap:18px 26px;
      align-items:start;
    }

    /* -- Step indicator -- */
    .ck-steps{
      display:flex;
      align-items:center;
      gap:14px;
      grid-column:1 / -1;
      padding:8px 0 16px;
      margin:0;
      position:-webkit-sticky;
      position:sticky;
      top:calc(var(--header-h) + var(--sat, 0px));
      z-index:30;
      isolation:isolate;
      background:var(--bg, #f6f7f9);
      overflow:auto hidden;
    }
    .ck-step{
      display:flex;
      align-items:center;
      gap:9px;
      font-size:.95rem;
      font-weight:800;
      color:#b4bbc6;
      letter-spacing:.02em;
    }
    .ck-step--done{ color:#68707f; }
    .ck-step--active{ color:#111315; }
    .ck-step-num{
      width:30px;
      height:30px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:.86rem;
      font-weight:900;
      background:rgba(17,19,21,.06);
      color:#98a2b3;
    }
    .ck-step--done .ck-step-num{
      background:#25d366;
      color:#fff;
    }
    .ck-step--active .ck-step-num{
      background:#111315;
      color:#fff;
    }
    .ck-step-sep{
      width:24px;
      height:1px;
      background:rgba(17,19,21,.12);
    }
    .ck-step-check{
      width:14px;
      height:14px;
    }
    #orderDetailSection{
      grid-column:1 / -1;
    }
    .actions,
    .support-line,
    .foot{
      grid-column:1 / -1;
    }
    .detail-note{margin:0;color:var(--muted);font-weight:700;font-size:.92rem;line-height:1.6}
    .detail-pill{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
    /* Solo lo usan ya las vistas "pago confirmado" y "pedido caducado" (el
       detalle normal usa .pedido-view). Le damos aspecto de tarjeta. */
    .order-detail-shell{display:grid;gap:18px;background:#fff;border-radius:20px;
      padding:24px;box-shadow:0 1px 3px rgba(15,23,42,.05),0 8px 22px rgba(15,23,42,.05)}
    .order-detail-top{
      display:grid;
      gap:16px;
      padding:16px;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255, 255, 255, 0.98));
      box-shadow:0 14px 30px rgba(15,23,42,.06);
    }
    .order-detail-actions{display:flex;gap:10px;flex-wrap:wrap}
    .order-detail-actions .order-cta{cursor:pointer}
    .order-detail-actions .order-cta:disabled{opacity:.72;cursor:wait}
    .order-empty-state{
      display:grid;
      gap:10px;
      padding:16px;
      border:1px solid rgba(185,30,30,.18);
      border-radius:18px;
      background:linear-gradient(180deg,#fff8f8 0%, #fff 100%);
      box-shadow:0 10px 24px rgba(15,23,42,.05);
    }
    .order-empty-state strong{
      font-family:var(--sport);
      font-weight:400;
      font-size:.86rem;
      letter-spacing:.06em;
      text-transform:uppercase;
      color:#9f1d1d;
    }
    .order-empty-state p{
      margin:0;
      font-size:.96rem;
      line-height:1.65;
      color:#334155;
      font-weight:700;
    }
    .order-tracking{display:grid;gap:8px}
    .tracking-status{
      display: flex;
      align-items: center;
      gap: .5em;
      font-size: 1.25rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.1;
    }
    /* La palabra siempre en negro; solo el icono toma el color del estado
       (--acc, lo pone .order-tracking). Misma paleta que el panel admin. */
    .tracking-status-ico{
      display: inline-flex;
      flex: 0 0 auto;
      color: var(--acc, #475569);
    }
    .tracking-status-ico svg{ width: 1.05em; height: 1.05em; display: block; }
    /* Línea de tiempo segmentada: iconos y segmentos son hermanos de una
       fila flex, no una barra continua con los emojis encima. Así cada
       segmento conserva sus extremos redondeados y el `gap` le da aire al
       icono tanto al principio como al final. */
    .track-line{
      /* Si un contenedor (.tracking-inline) define el tamaño, manda él; si
         no, 29px. Sin el fallback los iconos se quedaban sin medida en
         /pedido. */
      --icon-size: var(--timeline-icon-size, 29px);
      display: flex;
      align-items: center;
      gap: 6px;
      /* La fila ya reserva la altura del icono (antes sobresalían de una
         barra de 10px y los márgenes lo compensaban). El hueco superior lo
         pone el `gap` del contenedor. */
      margin-bottom: 8px;
    }
    .track-seg{
      flex: 1 1 0;
      min-width: 0;
      height: 10px;
      border-radius: 999px;
      background-color: #e7ebf0;
    }
    /* El tramo recorrido: color plano y sólido del estado (--acc). */
    .track-seg.is-on{
      background-color: var(--acc, #16a34a);
    }
    .track-ico{
      flex: 0 0 auto;
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 999px;
      background: #ffffff;
      color: #64748b;
      border: 1px solid #ecebeb;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(229, 229, 229, 0.30);
    }
    /* El icono es un SVG de línea que hereda `color` con currentColor; se
       dimensiona en proporción al círculo, así vale para desktop y móvil. */
    .track-ico svg{
      width: 58%;
      height: 58%;
      display: block;
    }
    /* Hito completado: icono y borde en el color del estado (--acc), borde
       2px. */
    .track-ico.is-done{
      color: var(--acc, #16a34a);
      border: 2px solid var(--acc, #16a34a);
    }
    /* Primer hito de un pedido cancelado: mismo tratamiento que el completado
       (el estado ES definitivo), pero con el icono de cancelación. --acc ya
       llega en rojo desde statusAccent(). */
    .track-ico.is-canceled{
      color: var(--acc, #991b1b);
      border: 2px solid var(--acc, #991b1b);
    }
    .order-products{display:grid;gap:12px}
    .order-product-list-shell.order-summary--checkout{
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;
      overflow:visible;
    }
    .order-product-list-shell .order-summary__product-list{
      display:grid;
      gap:12px;
    }
    .order-product-list-shell .order-summary__product{
      cursor:default;
      box-shadow:
        0 1px 0 rgba(255,255,255,.92) inset,
        0 12px 28px rgba(15,23,42,.06),
        0 4px 12px rgba(15,23,42,.03);
    }
    .order-product-list-shell .order-summary__product-title{
      flex:1 1 100%;
    }

    /* -- Actions -- */
    .actions{
      display:grid;
      gap:10px;
    }
      .order-cta{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:46px;
      padding:0 16px;
      border-radius:999px;
      border:1px solid #6b6c6c;
      font-weight:800;
      font-size:.79rem;
      letter-spacing:.03em;
      text-transform:uppercase;
      cursor:pointer;
      white-space:nowrap;
      transition:background .16s ease, box-shadow .16s ease, transform .16s ease, color .16s ease;
      text-decoration:none;
    }
    /* Los SVG dentro del botón se ocultaban con display:none (regla heredada
       del diseño antiguo). Ahora se muestran, alineados con el texto. */
    .order-cta svg{
      display:inline-block;
      vertical-align:middle;
      flex:0 0 auto;
      width:18px;
      height:18px;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
      /* Misma micro-interacción que el "Continuar a pago" del checkout (.ck-btn) */
      transition:transform .18s ease;
    }
    .order-cta:hover svg{ transform:translateX(3px); }
    .order-cta--primary{
      position:relative;
      isolation:isolate;
      background:linear-gradient(180deg, #373737 0%, #111111 100%);
      color:#fff;
      border-color:#6b6c6c;
      box-shadow:none;
    }
    /* Los degradados no interpolan con transition: para que el aclarado del hover
       sea gradual y no un salto seco, se funde una segunda capa por opacidad. */
    .order-cta--primary::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      border-radius:inherit;
      background:linear-gradient(180deg, #4a4a4a 0%, #171717 100%);
      opacity:0;
      pointer-events:none;
      transition:opacity .26s ease;
    }
    .order-cta--primary:hover::before,
    .order-cta--primary:focus-visible::before{ opacity:1; }
    .order-cta--primary:hover{
      transform:none;
      box-shadow:none;
      background:linear-gradient(180deg, #373737 0%, #111111 100%);
      border-color:#8f8f8f;
      color:#fff;
    }
    .order-cta--primary:focus-visible,
    .order-cta--primary:active{
      box-shadow:none;
      transform:none;
      color:#fff;
      background:linear-gradient(180deg, #373737 0%, #111111 100%);
      border-color:#6b6c6c;
    }
    /* Botón "Descargar recibo": mismo estilo que en /cuenta (sin borde,
       sombra suave) */
    .order-receipt-cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      min-height:46px;
      padding:0 18px;
      border:0;
      border-radius:999px;
      background:#fff;
      color:var(--ink);
      font-weight:800;
      font-size:.82rem;
      text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:
        0 -1px 3px rgba(15,23,42,.045),
        0 1px 0 rgba(255,255,255,.94) inset,
        0 14px 30px rgba(15,23,42,.09);
      transition:background .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .order-receipt-cta:hover{
      background:#f8fafc;
      box-shadow:
        0 -1px 4px rgba(15,23,42,.055),
        0 1px 0 rgba(255,255,255,.97) inset,
        0 18px 34px rgba(15,23,42,.11);
      transform:translateY(-1px);
    }
    .order-receipt-cta:active{ transform:translateY(0); }

    /* -- Footer -- */
    .foot{
      padding-top:8px;
      text-align:center;
      color:var(--muted);
      font-size:.82rem;
      font-weight:600;
    }
    .foot a{
      color:var(--ink);
      font-weight:800;
    }

    /* -- Responsive -- */
    #site-header-slot,

    #mobile-menu-slot{
      width:100%;
    }

    .order-page-container{
      width:min(1160px, calc(100% - 40px));
      gap:18px 26px;
    }
    .actions{
      grid-template-columns:1fr;
      max-width:380px;
      width:100%;
      margin:0 auto;
    }
    .order-detail-actions{
      display:grid;
    }
    .order-detail-actions .order-cta,
    .order-detail-actions .order-receipt-cta,
    .actions .order-cta{
      width:100%;
    }
    .support-line{
      margin:2px 0 0;
      text-align:center;
      color:var(--muted);
      font-size:.84rem;
      font-weight:700;
      line-height:1.5;
    }
    .support-line a{
      color:var(--ink);
      font-weight:800;
    }

    @media (max-width:820px){
      .wrap{
        padding:18px clamp(16px,2.5vw,22px) 26px;
      }
      .order-page-container{
        width:100%;
        grid-template-columns:1fr;
        gap:12px;
      }
      #orderDetailSection,
      .actions,
      .support-line,
      .foot{
        grid-column:auto;
        grid-row:auto;
      }
    }

    @media (max-width:700px){
      .wrap{ padding:14px clamp(16px,2.5vw,22px) 20px; }
      .ck-steps{padding:8px 0 12px;}
      .order-product-list-shell .order-summary__product-image{width:52px;height:52px}
    }

    @media (max-width:640px){
      .ck-steps{
        gap:12px;
        padding-bottom:16px;
        overflow-x:auto;
        scrollbar-width:none;
      }
      .ck-steps::-webkit-scrollbar{ display:none; }
      .ck-step{
        gap:8px;
        font-size:.9rem;
        white-space:nowrap;
      }
      .ck-step-num{
        width:28px;
        height:28px;
        font-size:.8rem;
      }
      .ck-step-sep{ width:18px; }
      .order-cta{
        font-size:.75rem;
        letter-spacing:.02em;
      }
    }

    /* Móvil: círculo más pequeño que en escritorio y huecos más estrechos,
       para que los segmentos se lleven el ancho que sobra (~326px útiles en
       un teléfono de 390px). El SVG escala solo con el círculo. */
    @media (max-width:480px){
      .track-line{ --timeline-icon-size:26px; gap:4px; }
    }

    @media (max-width:420px){
      .order-summary{
        border-radius:24px;
      }
      .order-product-list-shell .order-summary__product-line-total{
        min-width:0;
        font-size:1rem;
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       REDISEÑO /pedido/ — identidad propia de "panel de seguimiento".
       El color del estado (--acc) manda: franja del hero, tick de las
       etiquetas y timeline. Nada de esto se comparte con Pago/Checkout.
       ═══════════════════════════════════════════════════════════════ */
    .pedido-view{ display:grid; gap:16px; }

    /* Hero: franja superior del color de estado + lavado; el timeline manda */
    .pedido-hero{ position:relative; background:#fff; border-radius:22px; overflow:hidden;
      box-shadow:0 1px 3px rgba(15,23,42,.05),0 12px 34px rgba(15,23,42,.07); }
    .pedido-hero::before{ content:""; position:absolute; inset:0 0 auto 0; height:5px; background:var(--acc,#2563eb); }
    .pedido-hero-wash{ background:#fff; padding:26px 28px 22px; }
    .pedido-eyebrow{ margin:0; font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#64748b; }
    .pedido-eyebrow b{ color:#0f172a; font-variant-numeric:tabular-nums; }

    /* Timeline dentro del hero: grande, protagonista */
    .pedido-hero .order-tracking{ display:block; gap:0; margin-top:6px; }
    .pedido-hero .tracking-status{ font-size:1.9rem; margin:0 0 20px; }
    .pedido-hero .track-line{ --timeline-icon-size:38px; gap:9px; margin:0; }
    .pedido-hero .track-seg{ height:12px; }

    .pedido-hero-foot{ display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px;
      margin-top:22px; padding-top:18px; border-top:1px solid #eef0f3; }
    .pedido-track-chip{ display:inline-flex; align-items:center; gap:9px; border-radius:11px; padding:9px 14px;
      color:var(--acc,#2563eb); background:#f1f5f9; background:color-mix(in srgb, var(--acc,#2563eb) 12%, #fff); }
    .pedido-track-chip svg{ width:17px; height:17px; flex:0 0 auto; }
    .pedido-track-txt{ display:flex; flex-direction:column; line-height:1.25; }
    .pedido-track-txt small{ font-size:.64rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#64748b; }
    .pedido-track-num{ font-weight:800; font-size:.92rem; color:var(--acc,#2563eb); text-decoration:none; font-variant-numeric:tabular-nums; }
    .pedido-track-num--pending{ color:#64748b; }
    .pedido-upd{ margin-left:auto; font-size:.82rem; color:#64748b; font-weight:600; }
    .pedido-upd b{ color:#334155; font-variant-numeric:tabular-nums; }

    /* Etiqueta de sección "sport" con tick del color de estado */
    .pedido-label{ display:flex; align-items:center; gap:9px; margin:0 0 14px;
      font-size:.82rem; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:#334155; }
    .pedido-label::before{ content:""; width:16px; height:3px; border-radius:2px; background:var(--acc,#2563eb); }

    /* Cuerpo: productos (ancho) + total/entrega (estrecho).
       align-items:start evita que la columna de productos se estire para
       igualar la altura del lateral (dejaba un hueco blanco enorme). */
    .pedido-grid{ display:grid; grid-template-columns:1.55fr 1fr; gap:16px; align-items:start; }
    .pedido-panel{ background:#fff; border-radius:20px; padding:22px 22px 24px;
      box-shadow:0 1px 3px rgba(15,23,42,.05),0 8px 22px rgba(15,23,42,.05); }
    /* Los productos usan su tarjeta de siempre (.order-summary__product);
       aquí solo va la etiqueta encima, sin panel para no doblar tarjeta. */
    .pedido-products{ min-width:0; }

    .pedido-side{ min-width:0; }
    /* Color plano equivalente al botón "Volver al pago": su degradado va de
       #373737 a #111111, cuyo tono medio es #242424. */
    .pedido-total{ background:#242424; color:#fff;
      border-radius:16px; padding:16px 18px; margin-bottom:20px; }
    .pedido-total-k{ font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#cbd5e1; }
    .pedido-total-v{ font-size:1.7rem; font-weight:800; letter-spacing:-.01em; font-variant-numeric:tabular-nums; line-height:1.15; }
    .pedido-total-method{ font-size:.82rem; color:#e2e8f0; font-weight:600; margin-top:3px; }
    .pedido-total-method b{ color:#fff; }
    .pedido-total-fee{ font-size:.73rem; color:#a9adb3; font-weight:600; margin-top:7px; line-height:1.4; }

    /* Entrega va en el lateral, bajo el Total: con varios productos rellena
       la columna derecha en vez de dejarla vacía. Campos apilados. */
    .pedido-facts{ margin:0; }
    .pedido-fact{ display:flex; flex-direction:column; gap:1px; padding:11px 0; }
    .pedido-fact + .pedido-fact{ border-top:1px solid #eef0f3; }
    /* Etiqueta y valor con el mismo estilo que los campos del checkout
       (.field label / .field input de css/address-fields.css). */
    .pedido-fact dt{ color:var(--muted); font-weight:700; font-size:.78rem;
      text-transform:none; letter-spacing:.01em; }
    .pedido-fact dd{ margin:0; color:var(--ink); font-weight:600; font-size:16px;
      letter-spacing:.01em; word-break:break-word; }
    .pedido-fact-note{ display:block; margin-top:4px; font-size:.76rem; font-weight:600;
      line-height:1.45; color:#94a3b8; }
    /* La nota de entrega es texto libre del cliente, no un dato estructurado:
       cursiva + comilla de acento colgada para leerla como "su mensaje". */
    .pedido-fact dd.pedido-note{ font-style:italic; font-weight:600;
      font-size:15px; }
    .pedido-fact dd.pedido-note::before{ content:"\201C"; margin-right:2px;
      font-style:normal; font-weight:800; font-size:20px; line-height:0;
      vertical-align:-4px; color:var(--acc,#2563eb); opacity:.85; }
    .pedido-fact dd.pedido-note::after{ content:"\201D"; margin-left:2px;
      font-style:normal; font-weight:800; font-size:20px; line-height:0;
      vertical-align:-4px; color:var(--acc,#2563eb); opacity:.85; }

    /* Acciones dentro de la tarjeta lateral, bajo los datos de entrega:
       botón principal a todo el ancho de la tarjeta y la vuelta a la tienda
       como enlace de texto debajo. Igual en escritorio y en móvil. */
    .pedido-view .order-detail-actions{ display:flex; flex-direction:column; gap:12px;
      align-items:center; margin-top:18px; padding-top:16px; border-top:1px solid #eef0f3; }
    .pedido-view .order-detail-actions .order-cta,
    .pedido-view .order-detail-actions .order-receipt-cta{
      width:100%;
      min-width:0;
    }

    @media (max-width:760px){ .pedido-grid{ grid-template-columns:1fr; } }
    @media (max-width:560px){
      .pedido-hero-wash{ padding:22px 18px 18px; }
      .pedido-hero .tracking-status{ font-size:1.55rem; }
      .pedido-hero .track-line{ --timeline-icon-size:32px; gap:6px; }
      .pedido-hero .track-seg{ height:10px; }
      .pedido-panel{ padding:18px; }
      .pedido-upd{ margin-left:0; width:100%; }
    }

  </style>

<body class="order-confirmation-page">
  <div id="site-header-slot"></div>
  <div id="mobile-menu-slot"></div>
  <main class="wrap">
    <div class="order-page-container">
      <div class="ck-steps">
        <span class="ck-step ck-step--done" id="stepShipping">
          <span class="ck-step-num">
            <svg class="ck-step-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          Envío
        </span>
        <span class="ck-step-sep"></span>
        <span class="ck-step ck-step--done" id="stepPayment">
          <span class="ck-step-num">
            <svg class="ck-step-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          Pago
        </span>
        <span class="ck-step-sep"></span>
        <span class="ck-step ck-step--done" id="stepConfirmation">
          <span class="ck-step-num">
            <svg class="ck-step-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
          Confirmación
        </span>
      </div>

      <section id="orderDetailSection" class="order-view" hidden>
        <div id="orderDetailBody"></div>
      </section>

      <div class="actions">
        <a class="order-cta order-cta--primary" id="primaryOrderCta" href="/">
          Volver a la tienda
        </a>
      </div>

      <p class="support-line">
        ¿Necesitas ayuda? <a href="https://wa.me/34666318747" target="_blank" rel="noopener noreferrer">WhatsApp</a> · <a href="mailto:info@scootshop.co">info@scootshop.co</a>
      </p>

      <footer class="foot">
        <strong>SCOOT SHOP</strong> · Estado y seguimiento del pedido · <a href="/">scootshop.co</a>
      </footer>
    </div>
  </main>

  <script>
    (function(){
      const p = new URLSearchParams(location.search);
      const orderId = p.get('order') || p.get('tx') || '';
      const orderToken = p.get('token') || p.get('t') || '';
      const orderStatus = p.get('status') || p.get('st') || p.get('payment_status') || '';
      const productName = p.get('name') || p.get('item_name') || '';
      const amountText = p.get('amt') || p.get('mc_gross') || p.get('amount') || '';
      const currencyCode = (p.get('cc') || p.get('mc_currency') || p.get('currency') || 'EUR').toUpperCase();
      const queryEmail = p.get('email') || p.get('payer_email') || '';
      const previewActive = p.get('preview_active') === '1';
      const PREVIEW_ORDERS_KEY = 'ss_preview_orders_v1';
      const LOCAL_DEV_ORDERS_KEY = 'ss_local_dev_orders_account_v3';

      const orderDetailSection = document.getElementById('orderDetailSection');
      const orderDetailBody = document.getElementById('orderDetailBody');
      const stepShipping = document.getElementById('stepShipping');
      const stepPayment = document.getElementById('stepPayment');
      const stepConfirmation = document.getElementById('stepConfirmation');
      const primaryOrderCta = document.getElementById('primaryOrderCta');
      // Caja de acciones estática del pie. En el detalle normal se oculta,
      // porque la vuelta a la tienda se integra en la fila de acciones del
      // pedido; las vistas "caducado"/"pago confirmado" la vuelven a mostrar.
      const actionsBox = document.querySelector('.actions');

      function stepCheckSvg(){
        return '<svg class="ck-step-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      }

      function setStepState(stepEl, state, stepNumber){
        if (!stepEl) return;
        const num = stepEl.querySelector('.ck-step-num');
        stepEl.classList.remove('ck-step--done', 'ck-step--active');
        if (state === 'done') {
          stepEl.classList.add('ck-step--done');
          if (num) num.innerHTML = stepCheckSvg();
          return;
        }
        if (state === 'active') {
          stepEl.classList.add('ck-step--active');
        }
        if (num) num.textContent = String(stepNumber);
      }

      function applyCheckoutSteps(status){
        if (normalizeStatus(status) === 'pending_payment') {
          setStepState(stepShipping, 'done', 1);
          setStepState(stepPayment, 'active', 2);
          setStepState(stepConfirmation, 'pending', 3);
          return;
        }
        setStepState(stepShipping, 'done', 1);
        setStepState(stepPayment, 'done', 2);
        setStepState(stepConfirmation, 'done', 3);
      }

      function esc(value){
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeStatus(value){
        const raw = String(value || '').trim().toLowerCase();
        if (raw === 'paid' || raw === 'approved' || raw === 'complete' || raw === 'completed' || raw === 'pagado') return 'paid';
        if (raw === 'pending' || raw === 'pending_payment') return 'pending_payment';
        if (raw === 'processing' || raw === 'preparing') return 'processing';
        if (raw === 'shipped' || raw === 'shipping') return 'shipped';
        if (raw === 'delivered') return 'delivered';
        if (raw === 'cancelled' || raw === 'canceled' || raw === 'failed' || raw === 'denied') return 'cancelled';
        return raw || 'pending_payment';
      }

      function isLocalRuntime(){
        const host = String(location.hostname || '').toLowerCase();
        return host === 'localhost' || host === '127.0.0.1' || host === '::1';
      }

      // Mismo criterio que /cuenta (js/account.js): un único sitio decide qué
      // estados son "el pedido no va a llegar", para que el color, la etiqueta y
      // el timeline no puedan contradecirse entre sí.
      const CANCELED_STATUSES = /^(cancelled|canceled|refunded|payment_failed|dispute|error)$/;

      function isCanceledStatus(status){
        return CANCELED_STATUSES.test(String(status || ''));
      }

      function statusLabel(status){
        if (status === 'pending_payment') return 'Pendiente pago';
        if (status === 'paid') return 'Pagado';
        if (status === 'processing') return 'Preparando';
        if (status === 'shipped') return 'Enviado';
        if (status === 'delivered') return 'Entregado';
        // Cada motivo con su nombre, igual que en /cuenta. Antes todo esto caía
        // en «Revisa el pago», que además contradecía a la tarjeta de /cuenta.
        if (status === 'cancelled' || status === 'canceled') return 'Cancelado';
        if (status === 'refunded') return 'Reembolsado';
        if (status === 'payment_failed') return 'Pago fallido';
        if (status === 'dispute') return 'En disputa';
        if (status === 'error') return 'Error';
        return 'Pedido recibido';
      }
      // Color del estado para la cabecera y el tramo hecho del timeline. Misma
      // paleta que el panel admin (un color por estado). Se inyecta como --acc
      // en .order-tracking.
      function statusAccent(status){
        switch (status) {
          case 'pending_payment': return '#9a3412';
          case 'paid': return '#15803d';
          case 'processing':
          case 'preparing': return '#7c3aed';
          case 'reserved': return '#5b21b6';
          case 'shipped': return '#2563eb';
          case 'delivered': return '#16a34a';
          case 'cancelled':
          case 'canceled':
          case 'refunded':
          case 'payment_failed':
          case 'dispute':
          case 'error': return '#991b1b';
          default: return '#475569';
        }
      }
      // Icono de línea de la etapa actual para la cabecera (mismo set que el
      // timeline): reloj → check al pagar → caja → camión → casa; calendario si
      // reservado, ✕ si incidencia.
      function statusIcon(status){
        if (status === 'pending_payment') return TRACK_ICON.hourglass;
        if (status === 'paid') return TRACK_ICON.check;
        if (status === 'reserved') return TRACK_ICON.calendar;
        if (status === 'shipped') return TRACK_ICON.truck;
        if (status === 'delivered') return TRACK_ICON.house;
        if (status === 'cancelled' || status === 'canceled' || status === 'refunded' || status === 'payment_failed' || status === 'dispute' || status === 'error') return TRACK_ICON.alert;
        return TRACK_ICON.box;
      }

      function stageIndex(status){
        if (isCanceledStatus(status)) return 0;
        if (status === 'pending_payment') return 0;
        if (status === 'paid') return 1;
        if (status === 'processing') return 2;
        if (status === 'shipped') return 3;
        if (status === 'delivered') return 4;
        return 0;
      }

      function paymentMethodLabel(value){
        const m = String(value || '').trim().toLowerCase();
        if (!m) return '';
        if (m === 'paypal') return 'PayPal';
        if (m === 'card') return 'Tarjeta';
        if (m === 'klarna') return 'Klarna';
        if (m === 'bizum') return 'Bizum';
        if (m === 'transfer' || m === 'bank_transfer') return 'Transferencia';
        if (m === 'manual') return 'Manual';
        return m.charAt(0).toUpperCase() + m.slice(1);
      }

      function formatMoney(value, currency){
        const n = Number(value || 0);
        if (!isFinite(n)) return '—';
        try {
          return new Intl.NumberFormat('es-ES', {
            style: 'currency',
            currency: String(currency || 'EUR').toUpperCase(),
          }).format(n);
        } catch (_) {
          return n.toFixed(2) + ' ' + String(currency || 'EUR').toUpperCase();
        }
      }

      // Tipo de email (event_type de email_events) en lenguaje de cliente.
      // Si llega un tipo desconocido devolvemos '' y la nota omite el paréntesis.
      function emailKindLabel(type){
        const map = {
          'order.pending_payment': 'pedido pendiente de pago',
          'order.paid': 'confirmación de pago',
          'order.preparing': 'pedido en preparación',
          'order.shipped': 'aviso de envío',
          'order.delivered': 'confirmación de entrega',
          'order.reserved': 'confirmación de reserva',
          'order.canceled': 'cancelación del pedido',
          'order.refunded': 'reembolso'
        };
        return map[String(type || '').trim()] || '';
      }

      function formatDateTime(value){
        if (!value) return '—';
        const d = new Date(value);
        if (isNaN(d.getTime())) return String(value);
        return d.toLocaleString('es-ES', {
          day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });
      }

      // El teléfono se guarda en E.164 (+34629099690). Para leerlo lo partimos
      // en prefijo + bloques de 3: "+34 629 099 690". Solo separamos los
      // prefijos que ofrece el checkout; si el número no encaja, lo dejamos tal
      // cual antes que romperlo con un agrupado inventado.
      const PHONE_PREFIXES = ['351', '34', '33', '39', '49'];

      function formatPhone(value){
        const raw = String(value || '').trim();
        if (!raw) return '';
        const digits = raw.replace(/\D/g, '');
        if (!digits) return raw;
        // Bloques de 3; si al final fuese a quedar un dígito suelto, el último
        // bloque crece a 4 (así "+39 333 123 4567" en vez de "…456 7").
        const groups = function (num) {
          const out = [];
          for (let i = 0; i < num.length;) {
            const size = (num.length - i) === 4 ? 4 : 3;
            out.push(num.slice(i, i + size));
            i += size;
          }
          return out.join(' ');
        };
        // 00 al inicio es la otra forma de escribir el "+" internacional.
        let rest = digits.replace(/^00/, '');
        const hasCountry = raw.charAt(0) === '+' || /^00\d/.test(digits) || rest.length > 10;
        if (hasCountry) {
          for (let i = 0; i < PHONE_PREFIXES.length; i++) {
            const cc = PHONE_PREFIXES[i];
            if (rest.indexOf(cc) === 0 && rest.length > cc.length) {
              return '+' + cc + ' ' + groups(rest.slice(cc.length));
            }
          }
          return raw;
        }
        return groups(rest);
      }

      // Iconos SVG de línea (set coherente: trazo 2, esquinas redondeadas).
      // Heredan el color con currentColor. Reloj → check al pagar; luego caja,
      // camión y casa; calendario si reservado, ✕ si incidencia.
      const TRACK_ICON = {
        hourglass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.42A2 2 0 0 0 7 17.83V22"/><path d="M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
        box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="m7.5 4.27 9 5.15"/></svg>',
        truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
        house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.59 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
        alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
        calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>'
      };
      const TRACKING_STAGES = [
        { at: 1, title: 'Pendiente pago', icon: TRACK_ICON.hourglass, doneTitle: 'Pagado', doneIcon: TRACK_ICON.check },
        { at: 2, title: 'Preparando', icon: TRACK_ICON.box },
        { at: 3, title: 'Enviado', icon: TRACK_ICON.truck },
        { at: 4, title: 'Entregado', icon: TRACK_ICON.house }
      ];

      function renderTracking(status){
        const s = normalizeStatus(status);
        const idx = stageIndex(s);
        const isDelivered = idx >= 4 ? ' is-delivered' : '';
        const canceled = isCanceledStatus(s);
        const parts = [];
        TRACKING_STAGES.forEach(function(stage, i){
          const done = idx >= stage.at;
          // El segmento i-1 une el hito anterior con este: se pinta al alcanzarlo.
          if (i > 0) {
            parts.push('<i class="track-seg' + (done ? ' is-on' : '') + '" aria-hidden="true"></i>');
          }
          // En un pedido cancelado el primer hito deja de ser «pendiente de
          // pago»: pasa a ser el motivo de la cancelación, con su icono y el
          // color del estado. Los siguientes quedan apagados: el recorrido se
          // interrumpió ahí.
          const esCancelado = canceled && i === 0;
          const icon = esCancelado ? TRACK_ICON.alert : (done && stage.doneIcon ? stage.doneIcon : stage.icon);
          const title = esCancelado ? statusLabel(s) : (done && stage.doneTitle ? stage.doneTitle : stage.title);
          const cls = 'track-ico' + (done ? ' is-done' : '') + (esCancelado ? ' is-canceled' : '');
          parts.push('<span class="' + cls + '" title="' + esc(title) + '">' + icon + '</span>');
        });
        return [
          '<div class="order-tracking" style="--acc:' + statusAccent(s) + '">',
          '  <div class="tracking-status"><span class="tracking-status-ico">' + statusIcon(s) + '</span>' + esc(statusLabel(s)) + '</div>',
          '  <div class="track-line' + isDelivered + '">',
          '    ' + parts.join(''),
          '  </div>',
          '</div>'
        ].join('');
      }

      function normalizeItems(order){
        const input = Array.isArray(order && order.order_items) ? order.order_items : [];
        if (input.length) return input;
        const fallbackName = String(order && (order.name || productName) || '').trim();
        if (!fallbackName) return [];
        return [{
          name: fallbackName,
          qty: 1,
          image: String(order && order.product_image_url || '').trim(),
          color_label: String(order && (order.product_color_label || order.product_color) || '').trim(),
        }];
      }

      function renderItems(order){
        const items = normalizeItems(order);
        if (!items.length) return '<p class="detail-note">No hay productos disponibles para este pedido.</p>';
        return '<div class="order-products"><div class="order-product-list-shell order-summary order-summary--checkout"><div class="order-summary__product-list">' + items.map(function(item){
          const img = String(item.image || '').trim();
          const qty = Math.max(1, Number(item.qty || 1));
          /* El texto de variantes lo trae ya resuelto la API (`variant_text`), que a su
             vez lo recibió del núcleo cuando el cliente compró. Esta página NO decide
             qué es ese valor: escribía "Color:" pasara lo que pasara, así que un pedido
             de un patinete elegido por MODELO se leía como si fuera un color.
             El respaldo por catálogo es para pedidos servidos por una API antigua. */
          let variantText = String(item.variant_text || '').trim();
          if (!variantText && window.SS_ATTRS && typeof window.SS_ATTRS.describirTexto === 'function') {
            try {
              const lista = window.SCOOTSHOP_PRODUCTS || [];
              let prod = null;
              const skuLinea = String(item.sku || '');
              for (let i = 0; i < lista.length; i++) if (skuLinea && lista[i].sku === skuLinea) { prod = lista[i]; break; }
              variantText = window.SS_ATTRS.describirTexto(item, prod) || '';
            } catch (_) {}
          }
          if (/^(color:\s*)?no especificado$/i.test(variantText)) variantText = '';
          const sku = String(item.sku || '').trim();
          const itemCurrency = String(item.currency || order.currency || currencyCode || 'EUR').toUpperCase();
          const rawUnitPrice = Number(item.unit_price || item.price || item.amount || item.total_amount || 0);
          const rawLineTotal = Number(item.line_total || item.total || item.total_amount || (rawUnitPrice > 0 ? rawUnitPrice * qty : 0));
          const fallbackSingleTotal = items.length === 1 ? Number(order.total_amount || order.amount || amountText || 0) : 0;
          const lineTotalValue = rawLineTotal > 0 ? rawLineTotal : fallbackSingleTotal;
          const lineTotalText = lineTotalValue > 0 ? formatMoney(lineTotalValue, itemCurrency) : '—';
          return [
            '<article class="order-summary__product order-summary__product--line">',
            '  <div class="order-summary__product-main">',
            img ? ('<img class="order-summary__product-image" src="' + esc(img) + '" alt="Producto ' + esc(item.name || 'SCOOT SHOP') + '">') : '<img class="order-summary__product-image" src="/img/0-removebg-preview.webp" alt="Producto SCOOT SHOP">',
            '  <div class="order-summary__product-info">',
            '    <span class="order-summary__product-title">' + esc(item.name || 'Producto') + '</span>',
            sku ? ('    <span class="order-summary__product-meta order-summary__product-meta--ref">Ref: ' + esc(sku) + '</span>') : '',
            '    <span class="order-summary__product-meta order-summary__product-meta--color">' + esc(variantText || 'Único') + '</span>',
            '</div>',
            '  </div>',
            '  <div class="order-summary__product-side">',
            '    <strong class="order-summary__product-line-total">' + esc(lineTotalText) + '</strong>',
            '    <span class="order-summary__product-meta order-summary__product-meta--qty">Cant: ' + esc(qty) + '</span>',
            '  </div>',
            '</article>'
          ].join('');
        }).join('') + '</div></div></div>';
      }

      function buildAddress(ship){
        return [ship.address, ship.address2, ship.city, ship.province, ship.postal, ship.country].filter(Boolean).join(', ');
      }

      function saveResumeSessionPayload(payload){
        try {
          if (payload.shipping && typeof payload.shipping === 'object') {
            sessionStorage.setItem('ss_checkout_shipping', JSON.stringify(payload.shipping));
          }
          if (Array.isArray(payload.cartItems)) {
            sessionStorage.setItem('ss_checkout_cart_snapshot', JSON.stringify(payload.cartItems));
          }
        } catch (_) {
          /* ignore */
        }
      }

      function buildPreviewResumeUrl(order){
        const params = new URLSearchParams();
        params.set('resume', '1');
        params.set('checkout', '1');
        params.set('order', String(order.id || orderId || ''));
        params.set('sku', String(order.sku || ''));
        params.set('name', String(order.name || productName || 'Pedido SCOOT SHOP'));
        params.set('price', String(order.total_amount || order.amount || amountText || '0.00'));
        params.set('currency', String(order.currency || currencyCode || 'EUR').toUpperCase());
        if (order.product_url) params.set('url', String(order.product_url));
        if (order.product_image_url) params.set('image', String(order.product_image_url));
        if (order.product_color) params.set('color', String(order.product_color));
        if (order.product_color_label) params.set('colorLabel', String(order.product_color_label));
        if (Array.isArray(order.order_items) && order.order_items.length > 1) {
          params.set('cart', '1');
        }
        return '/pago?' + params.toString();
      }

      async function resumePendingPayment(order){
        if (!order || !order.id) return;

        if (previewActive) {
          window.location.href = buildPreviewResumeUrl(order);
          return;
        }

        const response = await fetch('/api/orders/resume-payment', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ orderId: String(order.id), token: orderToken })
        });

        let data = null;
        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok || !data || !data.ok || !data.paymentUrl) {
          throw new Error((data && data.error) ? data.error : 'resume_payment_failed');
        }

        saveResumeSessionPayload(data);
        window.location.href = String(data.paymentUrl);
      }

      let lastRenderKey = '';

      function renderDetail(order){
        if(!orderDetailSection || !orderDetailBody || !order){ return; }
        const renderKey = JSON.stringify([order.status, order.tracking, order.updated_at, order.total_amount || order.amount, order.receipt_url || '', Array.isArray(order.order_items) ? order.order_items.length : 0]);
        if (renderKey === lastRenderKey) return;
        lastRenderKey = renderKey;
        const ship = (order.shipping && typeof order.shipping === 'object') ? order.shipping : {};
        const status = normalizeStatus(order.status || orderStatus);
        const isPendingPayment = status === 'pending_payment';
        const tracking = String(order.tracking || '').trim();
        const fullName = String(order.customer_name || ship.name || order.payer_name || '').trim();
        const email = String(order.customer_email || ship.email || order.payer_email || queryEmail || '').trim();
        const phone = String(ship.phone || '').trim();
        const address = buildAddress(ship);
        const orderNumber = String(order.id || orderId || '—').trim();
        const amount = formatMoney(order.total_amount || order.amount || amountText, order.currency || currencyCode);
        const method = paymentMethodLabel(order.payment_method);
        const updatedAt = formatDateTime(order.updated_at || order.created_at);
        const receiptUrl = String(order.receipt_url || '').trim();
        const receiptFileName = 'recibo-' + orderNumber.replace(/[^A-Za-z0-9_-]+/g, '-') + '.pdf';
        const actionButtons = [];
        if (isPendingPayment) {
          actionButtons.push('<button type="button" class="order-cta order-cta--primary" id="resumePaymentBtn">Volver al pago<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>');
        }
        if (receiptUrl) {
          actionButtons.push('<a class="order-receipt-cta" href="' + esc(receiptUrl) + '" target="_blank" rel="noopener noreferrer" download="' + esc(receiptFileName) + '"><i class="fa-solid fa-receipt" aria-hidden="true"></i> Descargar recibo</a>');
        }
        const resumeAction = actionButtons.length
          ? ('<div class="order-detail-actions">' + actionButtons.join('') + '</div>')
          : '';
        // El botón "Volver a la tienda" del pie no se usa en el detalle.
        if (actionsBox) actionsBox.style.display = 'none';

        orderDetailSection.hidden = false;
        applyCheckoutSteps(status);
        const facts = [];
        if (fullName) facts.push('<div class="pedido-fact"><dt>Nombre</dt><dd>' + esc(fullName) + '</dd></div>');
        if (phone) facts.push('<div class="pedido-fact"><dt>Teléfono</dt><dd>' + esc(formatPhone(phone)) + '</dd></div>');
        // Bajo el correo, si consta algún aviso entregado, se indica cuándo
        // fue el último y se recuerda mirar en spam. Evita el "no me avisaron".
        // Normalizamos el DATETIME de MySQL ("2026-07-17 22:41:00") a ISO para
        // que parsee en cualquier navegador, y solo mostramos la nota si la
        // fecha es válida: formatDateTime devuelve el valor crudo si no lo es.
        const lastEmailRaw = String(order.last_email_at || '').trim().replace(' ', 'T');
        const lastEmailDate = lastEmailRaw ? new Date(lastEmailRaw) : null;
        let lastEmailNote = '';
        if (lastEmailDate && !isNaN(lastEmailDate.getTime())) {
          // Mismos tipos que registra el backend (event_type), pero con nombres
          // de cara al cliente: así sabe qué correo buscar en su bandeja.
          const kind = emailKindLabel(order.last_email_type);
          lastEmailNote = '<span class="pedido-fact-note">Último aviso enviado el '
            + esc(formatDateTime(lastEmailRaw))
            + (kind ? (' (' + esc(kind) + ')') : '')
            + '. Si no lo ves, revisa la carpeta de spam.</span>';
        }
        if (email) facts.push('<div class="pedido-fact"><dt>Correo electrónico</dt><dd>' + esc(email) + lastEmailNote + '</dd></div>');
        if (address) facts.push('<div class="pedido-fact"><dt>Dirección</dt><dd>' + esc(address) + '</dd></div>');
        // La nota de entrega que dejó el cliente en el checkout: se la
        // devolvemos para que confirme que su indicación quedó registrada.
        const shipNotes = String(ship.notes || '').trim();
        if (shipNotes) facts.push('<div class="pedido-fact"><dt>Notas de entrega</dt><dd class="pedido-note">' + esc(shipNotes) + '</dd></div>');
        const entregaBlock = facts.length
          ? ('<h2 class="pedido-label">Entrega</h2><dl class="pedido-facts">' + facts.join('') + '</dl>')
          : '';
        // "Pagado con" solo si el pedido está realmente cobrado; si sigue
        // pendiente (o cancelado) el método es el elegido, no uno ya pagado.
        const isPaidState = ['paid', 'processing', 'shipped', 'delivered'].indexOf(status) !== -1;
        const methodPrefix = isPaidState ? 'Pagado con' : 'Método:';
        // Nota bajo el total: deja claro que no queda nada por añadir.
        const feeNote = '        <div class="pedido-total-fee">Ya incluye la comisión del método de pago y los costes de envío.</div>';
        const trackNum = tracking
          ? ('<a class="pedido-track-num" href="https://parcelsapp.com/es/tracking/' + encodeURIComponent(tracking) + '" target="_blank" rel="noopener noreferrer">' + esc(tracking) + '</a>')
          : '<span class="pedido-track-num pedido-track-num--pending">Pendiente de tracking</span>';

        orderDetailBody.innerHTML = [
          '<div class="pedido-view" style="--acc:' + statusAccent(status) + '">',
          '  <section class="pedido-hero">',
          '    <div class="pedido-hero-wash">',
          '      <p class="pedido-eyebrow">Pedido · <b>' + esc(orderNumber) + '</b></p>',
          '      ' + renderTracking(status),
          '      <div class="pedido-hero-foot">',
          '        <span class="pedido-track-chip">',
          '          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
          '          <span class="pedido-track-txt"><small>Seguimiento</small>' + trackNum + '</span>',
          '        </span>',
          '        <span class="pedido-upd">Actualizado <b>' + esc(updatedAt) + '</b></span>',
          '      </div>',
          '    </div>',
          '  </section>',
          '  <div class="pedido-grid">',
          '    <section class="pedido-products">',
          '      <h2 class="pedido-label">Productos</h2>',
          '      ' + renderItems(order),
          '    </section>',
          '    <aside class="pedido-panel pedido-side">',
          '      <div class="pedido-total">',
          '        <div class="pedido-total-k">Total del pedido</div>',
          '        <div class="pedido-total-v">' + esc(amount) + '</div>',
          method ? ('        <div class="pedido-total-method">' + methodPrefix + ' <b>' + esc(method) + '</b></div>') : '',
          feeNote,
          '      </div>',
          '      ' + entregaBlock,
          '      ' + resumeAction,
          '    </aside>',
          '  </div>',
          '</div>'
        ].join('');

        const resumeBtn = document.getElementById('resumePaymentBtn');
        if (resumeBtn) {
          // Guardamos el contenido original (icono + texto) para restaurarlo
          // si el pago falla; con textContent se perdería el icono.
          const resumeBtnHtml = resumeBtn.innerHTML;
          resumeBtn.addEventListener('click', function(){
            resumeBtn.disabled = true;
            resumeBtn.textContent = 'Abriendo pago...';
            resumePendingPayment(order).catch(function(){
              resumeBtn.disabled = false;
              resumeBtn.innerHTML = resumeBtnHtml;
            });
          });
        }

      }

      function renderExpiredOrder(){
        if (!orderDetailSection || !orderDetailBody) return;

        orderDetailSection.hidden = false;
        applyCheckoutSteps('pending_payment');

        orderDetailBody.innerHTML = [
          '<div class="order-detail-shell">',
          '  <div class="order-empty-state">',
          '    <strong>Pedido caducado</strong>',
          '    <p>Este pedido ha caducado. Por favor, crea otro pedido para continuar.</p>',
          '  </div>',
          '</div>'
        ].join('');

        if (actionsBox) actionsBox.style.display = '';
        if (primaryOrderCta) {
          primaryOrderCta.textContent = 'Crear nuevo pedido';
          primaryOrderCta.href = '/checkout/?cart=1';
        }
      }

      // ¿El usuario llega de completar un pago? (status=paid o vuelta de Stripe)
      function isPaidReturn(){
        var s = String(orderStatus || '').toLowerCase();
        if (s === 'paid' || s === 'processing' || s === 'preparing' || s === 'shipped' || s === 'delivered') return true;
        return !!(p.get('session_id') || '');
      }

      // Confirmación tranquilizadora tras pagar, aun si el detalle no carga.
      // El cliente NUNCA debe ver "caducado" justo después de pagar.
      function renderPaidConfirmation(){
        if (!orderDetailSection || !orderDetailBody) return;
        orderDetailSection.hidden = false;
        applyCheckoutSteps('paid');

        var ref = orderId || '';

        orderDetailBody.innerHTML = [
          '<div class="order-detail-shell">',
          '  <div class="order-detail-top">',
          (ref ? ('    <div class="detail-pill"><span class="detail-note"><strong>Referencia:</strong> ' + esc(ref) + '</span></div>') : ''),
          '    <p class="detail-note"><strong>Pago recibido.</strong> Hemos confirmado tu pago correctamente.</p>',
          '  </div>',
          '  <div class="order-empty-state">',
          '    <strong>¡Gracias por tu compra!</strong>',
          '    <p>Tu pago se ha completado y tu pedido está confirmado. En unos minutos recibirás un correo con los detalles y el seguimiento (revisa también spam). No necesitas hacer nada más.</p>',
          '  </div>',
          '</div>'
        ].join('');

        if (actionsBox) actionsBox.style.display = '';
        if (primaryOrderCta) { primaryOrderCta.textContent = 'Volver al inicio'; primaryOrderCta.href = '/'; }
      }

      function buildPreviewOrder(){
        if (!previewActive || !orderId) return null;
        try {
          const raw = sessionStorage.getItem(PREVIEW_ORDERS_KEY);
          if (!raw) return null;
          const list = JSON.parse(raw);
          if (!Array.isArray(list)) return null;
          const item = list.find(function(x){ return String(x && x.id || '') === String(orderId); });
          if (!item) return null;
          return {
            id: String(item.id || orderId),
            name: String(item.product || item.name || 'Pedido de prueba'),
            status: String(item.status || 'processing'),
            amount: String(item.total_amount || item.amount || amountText || '0.00'),
            currency: String(item.currency || currencyCode || 'EUR'),
            payment_method: String(item.payment_method || 'manual'),
            tracking: String(item.tracking || ''),
            customer_name: String(item.customer || 'Cliente preview'),
            customer_email: String(item.email || queryEmail || 'cliente@scootshop.co'),
            product_image_url: String(item.product_image_url || ''),
            product_color: String(item.product_color || ''),
            product_color_label: String(item.product_color_label || item.product_color || ''),
            order_items: [{
              sku: String(item.sku || ''),
              name: String(item.product || item.name || 'Pedido de prueba'),
              qty: 1,
              image: String(item.product_image_url || ''),
              color: String(item.product_color || ''),
              color_label: String(item.product_color_label || item.product_color || ''),
            }],
            shipping: {
              name: String(item.ship_name || item.customer || ''),
              email: String(item.ship_email || item.email || ''),
              phone: String(item.ship_phone || ''),
              address: String(item.ship_address || ''),
              address2: String(item.ship_address2 || ''),
              city: String(item.ship_city || ''),
              province: String(item.ship_province || ''),
              postal: String(item.ship_postal || ''),
              country: String(item.ship_country || ''),
            },
            updated_at: String(item.updated_at || item.created_at || ''),
            created_at: String(item.created_at || ''),
          };
        } catch (_) {
          return null;
        }
      }

      function buildLocalDevOrder(){
        if (!isLocalRuntime() || !orderId) return null;
        try {
          const raw = localStorage.getItem(LOCAL_DEV_ORDERS_KEY);
          if (!raw) return null;
          const list = JSON.parse(raw);
          if (!Array.isArray(list)) return null;
          const item = list.find(function(x){ return String(x && x.id || '') === String(orderId); });
          if (!item) return null;
          const localItems = Array.isArray(item.order_items) && item.order_items.length
            ? item.order_items.map(function(entry){
                return {
                  sku: String(entry && entry.sku || ''),
                  name: String(entry && (entry.name || entry.product) || 'Pedido local'),
                  qty: Math.max(1, Number(entry && entry.qty || 1)),
                  image: String(entry && (entry.image || entry.product_image_url) || ''),
                  color: String(entry && (entry.color || entry.product_color) || ''),
                  color_label: String(entry && (entry.color_label || entry.product_color_label || entry.color || entry.product_color) || ''),
                  unit_price: Number(entry && (entry.unit_price || entry.price || entry.amount) || 0),
                  line_total: Number(entry && (entry.line_total || entry.total || entry.total_amount) || 0),
                };
              })
            : [{
                sku: String(item.sku || ''),
                name: String(item.product || item.name || 'Pedido local'),
                qty: 1,
                image: String(item.product_image_url || ''),
                color: String(item.product_color || ''),
                color_label: String(item.product_color_label || item.product_color || ''),
              }];
          return {
            id: String(item.id || orderId),
            sku: String(item.sku || ''),
            name: String(item.product || item.name || 'Pedido local'),
            status: String(item.status || 'pending_payment'),
            amount: String(item.total_amount || item.amount || amountText || '0.00'),
            total_amount: String(item.total_amount || item.amount || amountText || '0.00'),
            currency: String(item.currency || currencyCode || 'EUR'),
            payment_method: String(item.payment_method || 'manual'),
            tracking: String(item.tracking || ''),
            customer_name: String(item.customer_name || 'Cliente local'),
            customer_email: String(item.email || queryEmail || 'prueba.local@scootshop.co'),
            product_image_url: String(item.product_image_url || ''),
            product_color: String(item.product_color || ''),
            product_color_label: String(item.product_color_label || item.product_color || ''),
            receipt_url: String(item.receipt_url || ''),
            order_items: localItems,
            shipping: {
              name: String(item.ship_name || item.customer_name || ''),
              email: String(item.ship_email || item.email || ''),
              phone: String(item.ship_phone || ''),
              address: String(item.ship_address || ''),
              address2: String(item.ship_address2 || ''),
              city: String(item.ship_city || ''),
              province: String(item.ship_province || ''),
              postal: String(item.ship_postal || ''),
              country: String(item.ship_country || ''),
            },
            updated_at: String(item.updated_at || item.created_at || ''),
            created_at: String(item.created_at || ''),
          };
        } catch (_) {
          return null;
        }
      }

      function buildQueryFallback(){
        if (!orderId) return null;
        return {
          id: orderId,
          name: productName || 'Pedido SCOOT SHOP',
          status: normalizeStatus(orderStatus),
          amount: amountText || '0.00',
          currency: currencyCode || 'EUR',
          payment_method: '',
          tracking: '',
          customer_name: '',
          customer_email: queryEmail,
          order_items: [{ name: productName || 'Producto', qty: 1, image: '', color_label: '' }],
          shipping: { name: '', email: queryEmail, phone: '', address: '', address2: '', city: '', province: '', postal: '', country: '' },
          created_at: '',
          updated_at: '',
        };
      }

      // Caché stale-while-revalidate del detalle: pinta al instante en recargas
      // y vueltas atrás usando la última respuesta buena, y revalida en segundo
      // plano. sessionStorage (por pestaña) evita dejar datos del pedido en el
      // disco de un dispositivo compartido: la URL del pedido es capability-URL.
      function orderCacheKey(){
        if (!orderId) return '';
        return 'ss_pedido_detail:' + orderId + ':' + (orderToken || '');
      }
      function writeOrderCache(order){
        const key = orderCacheKey();
        if (!key || !order) return;
        try { sessionStorage.setItem(key, JSON.stringify(order)); } catch (_) { /* cuota/privado: ignora */ }
      }
      function renderCachedOrderDetail(){
        const key = orderCacheKey();
        if (!key) return false;
        try {
          const raw = sessionStorage.getItem(key);
          if (!raw) return false;
          const cached = JSON.parse(raw);
          if (!cached || typeof cached !== 'object') return false;
          renderDetail(cached);
          return true;
        } catch (_) { return false; }
      }

      async function loadOrderDetail(opts){
        const silent = !!(opts && opts.silent);
        if(!orderId){
          if (!silent) renderExpiredOrder();
          return;
        }

        const localOrder = buildLocalDevOrder();
        if (localOrder) {
          renderDetail(localOrder);
          return;
        }

        let apiError = '';
        try {
          const detailParams = new URLSearchParams({
            route: 'account_order_detail',
            id: orderId,
          });
          if (orderToken) {
            detailParams.set('token', orderToken);
          }
          const res = await fetch('/api/index.php?' + detailParams.toString(), { credentials: 'same-origin' });
          let data = null;
          try {
            data = await res.json();
          } catch (_) {
            data = null;
          }
          if (res.ok && data && data.ok && data.order) {
            writeOrderCache(data.order);
            renderDetail(data.order);
            return;
          }
          apiError = String((data && data.error) ? data.error : (res.status === 404 ? 'not_found' : ''));
        } catch (_) {
          apiError = 'request_failed';
        }

        if (silent) return;

        const previewOrder = buildPreviewOrder();
        if (previewOrder) {
          renderDetail(previewOrder);
          return;
        }

        if (previewActive || isLocalRuntime()) {
          const fallback = buildQueryFallback();
          if (fallback) {
            renderDetail(fallback);
            return;
          }
        }

        // Acaba de pagar: nunca mostrar "caducado". Confirmar el pago aunque el
        // detalle no haya podido cargar (el correo llegará con todos los datos).
        if (isPaidReturn()) {
          renderPaidConfirmation();
          return;
        }

        renderExpiredOrder();
      }

      const ORDER_REFRESH_MS = 20000;
      function startOrderAutoRefresh(){
        if (!orderId) return;
        setInterval(function(){
          if (document.hidden) return;
          loadOrderDetail({ silent: true });
        }, ORDER_REFRESH_MS);
        document.addEventListener('visibilitychange', function(){
          if (!document.hidden) loadOrderDetail({ silent: true });
        });
        window.addEventListener('focus', function(){
          loadOrderDetail({ silent: true });
        });
      }

      const waSupportLink = document.querySelector('a[href^="https://wa.me/"]');
      if (waSupportLink && orderId) {
        const waBase = waSupportLink.href.split('?')[0];
        waSupportLink.href = waBase + '?text=' + encodeURIComponent('Hola, necesito ayuda con mi pedido ' + orderId + '.');
      }

      // Pinta al instante desde caché si la hay (percepción inmediata) y luego
      // revalida en silencio; si no hay caché, carga normal con sus fallbacks.
      const paintedFromCache = renderCachedOrderDetail();
      loadOrderDetail(paintedFromCache ? { silent: true } : undefined);
      startOrderAutoRefresh();
    })();
  </script>
